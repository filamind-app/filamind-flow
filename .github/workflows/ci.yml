name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    permissions:
      contents: write # push the CI-built dist back to the PR branch
    defaults:
      run:
        working-directory: frontend
    steps:
      # On a PR, check out the branch tip (not the merge commit) so we can push the rebuilt dist
      # back to it; on push to main, head_ref is empty and the default checkout is used.
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check
      - run: npm run type-check
      - run: npm test
      # Every non-en locale must carry exactly the en key set (no missing / no extra). Trivial
      # while only en exists; becomes a real gate as translations land.
      - run: npm run i18n:keydiff
      - run: npm run build
      # The printer host serves the pre-built bundle straight from git (no Node on the Pi), so a
      # fresh, coherent dist must be committed. The bundler's chunk hashes are NOT byte-reproducible
      # across runs (the i18n virtual modules rehash), so a strict committed-vs-rebuild match can't
      # pass. The PR job is the real gate: on every PR it rebuilds and commits the canonical
      # CI-built dist back to the branch. On push to main we sanity-check that a coherent bundle is
      # committed (index.html present and pointing at a chunk that exists) and only warn on hash drift.
      - name: Commit rebuilt dist back to the PR branch
        if: github.event_name == 'pull_request'
        run: |
          if [ -n "$(git status --porcelain -- dist)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add dist
            # [skip ci] on the bot's dist commit so its push doesn't create a spurious
            # "approval required" workflow run on the PR. EXCEPT on a release branch: that dist
            # commit becomes main's tip and gets tagged, and a [skip ci] commit would skip the
            # tag-triggered release build.
            msg="chore(ci): rebuild frontend/dist"
            case "${{ github.head_ref }}" in chore/release-*) : ;; *) msg="$msg [skip ci]" ;; esac
            git commit -m "$msg"
            git push origin HEAD:${{ github.head_ref }}
          fi
      - name: Sanity-check committed frontend/dist
        if: github.event_name == 'push'
        run: |
          test -f dist/index.html || { echo "::error::dist/index.html is missing"; exit 1; }
          # The index.html entry chunk is named after the Vite input key: 'main-*.js' since the
          # multi-entry build (index.html + touch.html) was added, 'index-*.js' for a single entry.
          entry=$(grep -oE 'assets/(main|index)-[A-Za-z0-9_-]+\.js' dist/index.html | head -1)
          if [ -z "$entry" ] || [ ! -f "dist/$entry" ]; then
            echo "::error::dist entry chunk missing or unreferenced ($entry) - the committed bundle is broken/stale"
            exit 1
          fi
          if [ -n "$(git status --porcelain -- dist)" ]; then
            echo "::warning::frontend/dist differs from a fresh local rebuild (non-deterministic bundler hashes); the committed bundle is the canonical PR build."
          fi

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: mypy app
      - run: pytest -m "not e2e"

  # The real app against an in-process HTTP Moonraker stub - fails when the app can no
  # longer come up against a Moonraker-shaped boundary or its gated write path breaks.
  e2e:
    name: E2E smoke
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: pytest -m e2e -q

  # Compile the native Tauri shell so the touch app can't silently break. This is a COMPILE check
  # (no OS bundling) - bundling needs generated app icons (`npm run tauri icon`) and a per-arch
  # packaging step, which land with the native build. Verifies the Rust shell + the webview
  # frontend (frontendDist = ../dist) integrate and build.
  tauri:
    name: Tauri compile
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Tauri 2 Linux prerequisites
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file \
            libxdo-dev libssl-dev libayatana-appindicator3-dev librsvg2-dev
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: frontend/src-tauri
      - run: npm ci
      - run: npm run build # the webview bundle Tauri embeds (frontendDist = ../dist)
      # generate_context! needs the app icons at compile time; generate them from the tracked source.
      - run: npm run tauri -- icon src-tauri/icons/icon-source.png
      - run: cargo build --manifest-path src-tauri/Cargo.toml
