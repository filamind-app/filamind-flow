# filamind-oom.conf - shield Klipper from the OOM killer when a native FilaMind kiosk is running.
# Applied opt-in by `deploy/install-native.sh --protect-oom`. The kiosk unit sets a positive
# OOMScoreAdjust (more killable); this makes Klipper strongly preferred-to-keep, so under memory
# pressure on the ~1 GB host the kernel reaps the replaceable kiosk first - never Klipper mid-print.
# Remove /etc/systemd/system/klipper.service.d/filamind-oom.conf (+ daemon-reload) to revert.
[Service]
OOMScoreAdjust=-800
MemoryMin=48M
