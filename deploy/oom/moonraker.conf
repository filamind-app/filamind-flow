# filamind-oom.conf - shield Moonraker from the OOM killer when a native FilaMind kiosk is running.
# Applied opt-in by `deploy/install-native.sh --protect-oom`. The kiosk unit sets a positive
# OOMScoreAdjust (more killable); this makes Moonraker strongly preferred-to-keep, so under memory
# pressure on the ~1 GB host the kernel reaps the replaceable kiosk first - never Moonraker (which
# has been OOM-killed before). Remove /etc/systemd/system/moonraker.service.d/filamind-oom.conf
# (+ daemon-reload) to revert.
[Service]
OOMScoreAdjust=-800
MemoryMin=48M
